{% extends 'base.html' %}
{% block content %}
{% load custom_filters %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Subject</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa; /* Light gray background for better readability */
        }
        .card {
            /* Adds shadow and rounded corners to the form container */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">Update Subject</h3>
                    </div>
                    <div class="card-body">
                        <form action="{% url 'update_subject' subject.id %}" method="POST" id="updatesubjectForm" class="needs-validation" novalidate>
                            {% csrf_token %}
                            {% if message %}
                            <div class="alert alert-info" role="alert">
                                {{ message }}
                            </div>
                            {% endif %}

                            <div class="mb-3">
                                <label for="nameSubject" class="form-label">Subject Name:</label>
                                <input type="text" name="nameSubject" id="nameSubject" class="form-control rounded-pill" value="{{ subject.nameSubject }}" required>
                                <div class="invalid-feedback">
                                    Please enter a subject name.
                                </div>
                            </div>

                            <button type="submit" class="btn btn-outline-primary rounded-pill" id="submitButton">Update</button>
                        </form>
                        <script>
                            document.getElementById('updatesubjectForm').addEventListener('submit', function(event) {
                                const button = document.getElementById('submitButton');
                                button.disabled = true;
                                button.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Wait...';
                            });
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
</body>
</html>
{% endblock %}
