{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto p-3 sm:p-5 lg:p-6">
    <!-- Form Section -->
    <div class="bg-white rounded-xl shadow-md p-4 sm:p-6">
        <h2 class="text-lg sm:text-xl font-semibold text-gray-900 mb-4 text-center">Update Academic Year</h2>
        
        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}bg-green-50 text-green-600{% else %}bg-red-50 text-red-600{% endif %} p-3 rounded-md text-center text-xs sm:text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'finance:update_academic_year' academic_year.id %}" id="academicYearForm" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="year" class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Academic Year</label>
                <input type="text" id="year" name="year" class="w-full p-2 sm:p-3 border border-gray-200 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-xs sm:text-sm" value="{{ academic_year.year }}" placeholder="e.g., 2024-2025" required>
            </div>
            <div>
                <label for="teacherclass" class="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Class</label>
                <select id="teacherclass" name="teacherclass" class="w-full p-2 sm:p-3 border border-gray-200 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-xs sm:text-sm" required>
                    {% for class in teacher_classes %}
                        <option value="{{ class.id }}" {% if class.id == academic_year.teacherclass.id %}selected{% endif %}>
                            {{ class.ClassName|default:"Unnamed Class" }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="is_active" name="is_active" class="h-3 w-3 sm:h-4 sm:w-4 text-indigo-600 focus:ring-indigo-500 border-gray-200 rounded" {% if academic_year.is_active %}checked{% endif %}>
                <label for="is_active" class="ml-2 text-xs sm:text-sm text-gray-700">Active (Open for Installments)</label>
            </div>
            <button type="submit" class="w-full py-2 sm:py-3 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors duration-200 flex items-center justify-center text-xs sm:text-sm" id="submitBtn">
                <span id="spinner" class="hidden animate-spin h-4 w-4 sm:h-5 sm:w-5 mr-2 border-2 border-white border-t-transparent rounded-full"></span>
                Update Year
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.tailwindcss.com"></script>
<script>
    document.getElementById('academicYearForm').addEventListener('submit', function() {
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        submitBtn.disabled = true;
        spinner.classList.remove('hidden');
    });
</script>
{% endblock %}
