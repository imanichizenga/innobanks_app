{% extends 'base.html' %}
{% block content %}
{% load custom_filters %}
<!-- Include Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<div class="container my-5">
    <!-- Header Section -->
    <h2 class="fw-bold text-primary mb-4"><i class="fas fa-edit me-2"></i>Update Required Subject</h2>

    <!-- Messages -->
    {% if messages %}
    <div class="mb-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            <i class="fas fa-{% if message.tags == 'success' %}check-circle{% else %}exclamation-circle{% endif %} me-2"></i>{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Update Form -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Update Subject</h5>
        </div>
        <div class="card-body">
            <form action="{% url 'update_required_subject' required_subject.id %}" method="post" class="row g-3">
                {% csrf_token %}
                <div class="col-12 col-md-4">
                    <label for="subject" class="form-label fw-semibold"><i class="fas fa-book me-2"></i>Subject</label>
                    <select name="subject" id="subject" class="form-select" required>
                        <option value="" disabled>Select a Subject</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.id }}" {% if subject.id == required_subject.subject.id %}selected{% endif %}>
                            {{ subject.nameSubject|default:"Unnamed Subject" }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label for="level" class="form-label fw-semibold"><i class="fas fa-level-up-alt me-2"></i>Level</label>
                    <select name="level" id="level" class="form-select" required>
                        <option value="" disabled>Select Level</option>
                        <option value="Primary" {% if required_subject.level == 'Primary' %}selected{% endif %}>Primary</option>
                        <option value="Olevel" {% if required_subject.level == 'Olevel' %}selected{% endif %}>O Level</option>
                        <option value="Alevel" {% if required_subject.level == 'Alevel' %}selected{% endif %}>A Level</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label for="teacherclass" class="form-label fw-semibold"><i class="fas fa-chalkboard-teacher me-2"></i>Class</label>
                    <select name="teacherclass" id="teacherclass" class="form-select" required>
                        <option value="" disabled>Select a Class</option>
                        {% for teacherclass in teacher_classes %}
                        <option value="{{ teacherclass.id }}" {% if teacherclass.id == required_subject.teacherclass.id %}selected{% endif %}>
                            {{ teacherclass }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="fas fa-check-circle me-2"></i>Update
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
