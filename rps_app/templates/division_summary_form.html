{% extends 'base.html' %}
{% load static %}
{% load custom_filters %}

{% block content %}
<div class="container my-5">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fas fa-chart-pie me-2"></i>View Division Summary</h2>
    </div>

    {% if messages %}
    <div class="col-12">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            <i class="fas fa-info-circle me-2"></i>{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Division Summary Form -->
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <form method="POST" action="{% url 'division_summary' %}" class="row g-3" id="divisionSummaryForm">
                {% csrf_token %}
                <div class="col-12 col-md-6">
                    <label for="class_id" class="form-label fw-semibold"><i class="fas fa-chalkboard me-2"></i>Select Classes (Multiple)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-chalkboard-teacher"></i></span>
                        <select class="form-select rounded-end" id="class_id" name="class_id" multiple required size="5">
                            <option value="" disabled>Select classes</option>
                            {% for class in classes %}
                            <option value="{{ class.id }}" {% if selected_class_ids_list and class.id in selected_class_ids_list %}selected{% endif %}>
                                {{ class.ClassName.class_name|default:"Unnamed Class" }}{% if class.academicclassyear %} ({{ class.academicclassyear.academic_year_name }}){% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <small class="form-text text-muted">Hold Ctrl (or Cmd on Mac) to select multiple classes.</small>
                </div>
                <div class="col-12 col-md-6">
                    <label for="grade_id" class="form-label fw-semibold"><i class="fas fa-graduation-cap me-2"></i>Select Grading System</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-book"></i></span>
                        <select class="form-select rounded-end" id="grade_id" name="grade_id" required>
                            <option value="" disabled {% if not grading_system %}selected{% endif %}>Select a grading system</option>
                            {% for grade in grades %}
                            <option value="{{ grade.id }}" {% if grading_system and grading_system.id == grade.id %}selected{% endif %}>
                                {% if grade.is_primary %}Primary{% elif grade.is_advance %}A-Level{% else %}O-Level{% endif %} (ID: {{ grade.id }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="examination_id" class="form-label fw-semibold"><i class="fas fa-file-alt me-2"></i>Select Examination</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-clipboard-check"></i></span>
                        <select class="form-select rounded-end" id="examination_id" name="examination_id" required>
                            <option value="" disabled {% if not examination %}selected{% endif %}>Select an examination</option>
                            {% for exam in examinations %}
                            <option value="{{ exam.id }}" {% if examination and examination.id == exam.id %}selected{% endif %}>{{ exam.exam_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-12 col-md-4 d-flex align-items-end">
                    <button class="btn btn-primary w-100 rounded-pill" type="submit" id="submitButton">
                        <i class="fas fa-search me-2"></i>View Summary
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Include Font Awesome and Animate.css for icons and animations -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" integrity="sha512-c42qTSw/wPZ3/5LBzD+Bw5f7bSF2oxou6wEb+I/lqeaKV5FDIfMvvRp772y4jcJLKuGUOpbJMdg/BTl50fJYAw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<script>
    document.getElementById('divisionSummaryForm').addEventListener('submit', function(event) {
        const button = document.getElementById('submitButton');
        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Processing...';
    });
</script>
{% endblock %}
