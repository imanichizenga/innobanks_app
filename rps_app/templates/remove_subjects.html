{% extends 'base.html' %}
{% block content %}
{% load custom_filters %}
<div class="container py-5">
    <h2>Remove Subjects for {{ student.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="subjects" class="form-label">Select Subjects to Remove:</label>
            <select name="subjects" id="subjects" class="form-select" multiple>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}">{{ subject.nameSubject }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-danger">Remove Selected Subjects</button>
        <a href="{% url 'select_class' class_id=student.teacherclass.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
