{% extends 'base.html' %}

{% block content %}
{% load custom_filters %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Select Examination</h2>
                </div>
                <div class="card-body p-5">
                    {% if messages %}
                        <div class="mb-4">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="examination_id" class="form-label fw-bold">Examination Name</label>
                            <select name="examination_id" id="examination_id" class="form-select" required>
                                <option value="">-- Select an Examination --</option>
                                {% for exam in examinations %}
                                    <option value="{{ exam.id }}">{{ exam.exam_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Proceed</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
