<!-- templates/update_composite_subject.html -->
{% extends 'base.html' %}
{% block content %}
{% load custom_filters %}
<!-- Include Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<div class="container my-5">
    <!-- Header Section -->
    <h2 class="fw-bold text-primary mb-4"><i class="fas fa-edit me-2"></i>Update Composite Subject</h2>

    <!-- Messages -->
    {% if messages %}
    <div class="mb-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            <i class="fas fa-{% if message.tags == 'success' %}check-circle{% else %}exclamation-circle{% endif %} me-2"></i>{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Update Form -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Update Composite Subject: {{ composite_subject.subject_name|default:"Unnamed" }}</h5>
        </div>
        <div class="card-body">
            <form action="{% url 'update_composite_subject' composite_subject.id %}" method="post" class="row g-3">
                {% csrf_token %}
                <div class="col-12 col-md-4">
                    <label for="subject_name" class="form-label fw-semibold"><i class="fas fa-tag me-2"></i>Composite Subject Name</label>
                    <input type="text" name="subject_name" id="subject_name" class="form-control" value="{{ composite_subject.subject_name|default:'' }}" placeholder="e.g., Science Group" required>
                </div>
                <div class="col-12 col-md-4">
                    <label for="subjects" class="form-label fw-semibold"><i class="fas fa-book me-2"></i>Select Subjects (Hold Ctrl/Cmd to select multiple)</label>
                    <select name="subjects" id="subjects" class="form-select" multiple required size="5">
                        {% for subject in subjects %}
                        <option value="{{ subject.id }}" {% if current_subject_ids and subject.id|stringformat:"s" in current_subject_ids %}selected{% endif %}>
                            {{ subject.nameSubject|default:"Unnamed Subject" }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <label for="allow_to_use" class="form-label fw-semibold"><i class="fas fa-toggle-on me-2"></i>Allow to Use</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="allow_to_use" id="allow_to_use" {% if composite_subject.allow_to_use %}checked{% endif %}>
                        <label class="form-check-label" for="allow_to_use">
                            Enable for reports/grading
                        </label>
                    </div>
                </div>
                <div class="col-12 col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="fas fa-check-circle me-2"></i>Update
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
