{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4 class="mb-2">Delete Lead</h4>
      <p class="text-muted">Are you sure you want to delete <strong>{{ lead.name }}</strong> ({{ lead.phone }})?</p>
      <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'crm_lead_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
