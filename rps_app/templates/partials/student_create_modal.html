{% load static %}
<div class="modal fade" id="studentCreateModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable student-create-dialog">
    <div class="modal-content border-0 shadow">
      <form action="{% url 'create_student' %}" method="POST" enctype="multipart/form-data" id="studentForm" class="needs-validation" novalidate>
        {% csrf_token %}
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="bi bi-person-plus-fill me-2"></i>Add Student</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3 g-md-2">
            <div class="col-12 col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="fullName" required>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label">Gender</label>
              <select class="form-select" name="sex" required>
                <option value="" selected disabled>Select</option>
                <option value="M">Male</option><option value="F">Female</option><option value="O">Other</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label">Contact</label>
              <input type="tel" class="form-control" name="contact" required>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Class</label>
              <select class="form-select" name="teacherclass" id="modalTeacherClass" required>
                <option value="" disabled>Select Class</option>
                {% for class in classes %}
                <option value="{{ class.id }}" {% if selected_class and selected_class.id == class.id %}selected{% endif %}>{{ class.ClassName.class_name }}{% if class.academicclassyear %} ({{ class.academicclassyear.academic_year_name }}){% endif %}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Academic Level</label>
              <select class="form-select" name="academic_level" id="modalAcademicLevel" required>
                <option value="" selected disabled>Select academic level</option>
                <option value="FTNA">FTNA</option>
                <option value="CSEE">CSEE</option>
                <option value="ACSEE">ACSEE</option>
                <option value="ECDE">ECDE</option>
                <option value="English course">English course</option>
                <option value="Computer course">Computer course</option>
                <option value="pre form five">pre form five</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Index Number</label>
              <div class="input-group">
                <input type="text" class="form-control" name="indexNumber" id="modalIndexNumber" value="{{ index_number_seed }}" required>
                <button type="button" class="btn btn-outline-secondary" id="regenerateIndexBtn"><i class="bi bi-arrow-repeat"></i></button>
              </div>
              <small class="text-muted">Auto-generated, but editable.</small>
            </div>
            <div class="col-12">
              <label class="form-label">Student Photo</label>
              <input type="hidden" name="captured_photo_data" id="studentCapturedPhotoData">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <input type="file" class="form-control" name="photo" id="studentPhotoInput" accept="image/*">
                  <div class="ratio ratio-4x3 mt-2 bg-dark rounded overflow-hidden">
                    <video id="studentCameraPreview" class="w-100 h-100 object-fit-cover d-none" autoplay playsinline muted></video>
                    <div id="studentCameraPlaceholder" class="d-flex align-items-center justify-content-center text-white-50">Camera preview</div>
                  </div>
                  <div class="d-flex gap-2 mt-2">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="studentStartCamera">Open Camera</button>
                    <button type="button" class="btn btn-outline-success btn-sm" id="studentCaptureCamera" disabled>Capture</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="studentStopCamera" disabled>Close</button>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="ratio ratio-4x3 bg-white border rounded overflow-hidden">
                    <img id="studentPhotoPreview" class="w-100 h-100 object-fit-cover d-none" alt="Student preview">
                    <div id="studentPreviewPlaceholder" class="d-flex align-items-center justify-content-center text-muted">Preview appears here</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" type="submit" id="submitButton"><i class="bi bi-check2-circle me-1"></i>Create Student</button>
        </div>
      </form>
    </div>
  </div>
</div>
