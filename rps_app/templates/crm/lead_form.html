{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">{{ title }}</h2>
      <p class="text-muted mb-0">Update lead details and save changes.</p>
    </div>
    <a href="{% url 'crm_lead_list' %}" class="btn btn-outline-secondary">Back</a>
  </div>
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" class="row g-3">
        {% csrf_token %}
        {% for field in form %}
          <div class="col-md-6 col-xl-3 {% if field.name == 'description' %}col-12{% endif %}">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{% url 'crm_lead_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
