<!-- templates/delete_composite_subject.html (Simple confirmation template) -->
{% extends 'base.html' %}
{% block content %}
{% load custom_filters %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-trash-alt me-2"></i>Confirm Delete</h5>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                    <h6>Are you sure you want to delete the composite subject "{{ composite_subject.subject_name|default:'Unnamed' }}"?</h6>
                    <p class="text-muted">This action cannot be undone.</p>
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-2">
                            <i class="fas fa-trash-alt me-2"></i>Yes, Delete
                        </button>
                    </form>
                    <a href="{% url 'composite_subjects' %}" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
